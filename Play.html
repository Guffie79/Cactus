<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cactus – jeu de cartes en ligne</title>
<meta name="description" content="Cactus, le jeu de cartes de mémoire et de bluff. 2 à 5 joueurs, sur téléphone, tablette ou ordinateur. Gratuit, sans compte.">
<meta name="theme-color" content="#171a3a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cactus">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23171a3a'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8C%B5%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23171a3a'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8C%B5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lobster&family=Pacifico&family=Permanent+Marker&family=Bangers&family=Orbitron:wght@700&family=Press+Start+2P&family=Creepster&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg1:#323872;--bg2:#262b57;--bg3:#171a3a;--fg:#f3e6c8;--mut:#a9aed6;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --field:rgba(10,12,35,.45);--sheet:#262b57;--phc:#8389bb;--acc:#ffc857;
  --sand:#f3e6c8;--sand2:#e6d4aa;--cactus:#3f9d5a;--cactus-d:#2c7343;--flower:#ff5c8a;--sun:#ffc857;--ink:#1e2142;--red:#d6285a;
  --felt-a:#2c7d49;--felt-b:#1d5c35;--felt-edge:#17462a;
  --ow:30px;--oh:44px;--mw:54px;--mh:78px;--pw:60px;--pph:86px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg1:#fff8e6;--bg2:#f6ecd0;--bg3:#ead9ae;--fg:#1e2142;--mut:#5d6290;--panel:rgba(30,33,66,.06);--line:rgba(30,33,66,.18);
  --field:#fff;--sheet:#fff8e6;--phc:#8a8fb5;--acc:#9a5b00;--red:#c81f4e;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){
  --bg1:#fff8e6;--bg2:#f6ecd0;--bg3:#ead9ae;--fg:#1e2142;--mut:#5d6290;--panel:rgba(30,33,66,.06);--line:rgba(30,33,66,.18);
  --field:#fff;--sheet:#fff8e6;--phc:#8a8fb5;--acc:#9a5b00;--red:#c81f4e;
}}
:root[data-cards="big"]{--ow:36px;--oh:52px;--mw:62px;--mh:90px;--pw:68px;--pph:98px}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;color:var(--fg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  background:radial-gradient(120% 60% at 50% 0%,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 100%) fixed;background-color:var(--bg3)}
#app{max-width:620px;margin:0 auto;padding:0 12px 36px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.05}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:8px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
.tools{display:flex;gap:5px}
.link{background:none;border:1px solid var(--line);color:var(--fg);padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;margin:0}
.link:hover{background:var(--panel)}

/* boutons / champs */
button{font:inherit;border:0;border-radius:14px;padding:13px 18px;background:var(--flower);color:#fff;font-weight:700;margin:4px 6px 4px 0;cursor:pointer;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.07)}
button.s{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button.on,button.go{background:var(--sun);color:var(--ink)}
button.w{width:100%;margin-right:0}
button.sm{padding:8px 12px;font-size:13px;margin:6px 0 0}
button[disabled]{opacity:.4;cursor:not-allowed;filter:none}
input[type=text],input[type=email],input[type=password],input:not([type]){font:inherit;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--field);color:var(--fg);width:100%;margin:4px 0}
input::placeholder{color:var(--phc)}
input:focus{outline:none;border-color:var(--sun)}
#cd{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-weight:800;font-size:22px}

/* panneaux */
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--sun);color:var(--ink)}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;border:2px solid rgba(255,255,255,.65);background:var(--cactus)}
.av.lg{width:68px;height:68px;font-size:28px}
.avb{position:relative;background:none;border:0;padding:0;margin:0;flex:none;border-radius:50%}
.avb i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:13px;background:var(--sun);color:var(--ink);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* accueil */
.hero{text-align:center;padding:4px 0}
.hero svg{width:min(56vw,230px);height:auto;display:block;margin:0 auto}
.hero h1{font-size:clamp(50px,15vw,80px);margin-top:-6px}
.hero .sub{font-size:17px;color:var(--mut);max-width:30ch;margin:10px auto 0}
.nrow{display:flex;align-items:center;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px;margin:6px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--acc);font-size:14px;margin-top:6px;min-height:20px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 6px;text-align:center}
.feat div{font-size:13px;color:var(--mut);background:var(--panel);border-radius:14px;padding:12px 6px;border:1px solid var(--line)}
.feat b{display:block;font-size:22px;color:var(--fg);margin-bottom:2px}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:20px}

/* salon */
.codeb{text-align:center}
.code{font-size:clamp(44px,15vw,70px);font-weight:800;letter-spacing:.14em;margin:4px 0 8px;padding-left:.14em;color:var(--acc)}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 5px;font-weight:600}

/* cartes */
.c{width:44px;height:64px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;user-select:none;cursor:pointer;position:relative;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.22) 0 5px,transparent 6px) 0 0/14px 14px,
    linear-gradient(145deg,var(--cactus),var(--cactus-d));
  border:2px solid var(--sand);box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .12s}
.c:hover{transform:translateY(-2px)}
.c.up{background:var(--sand);color:var(--ink);border-color:var(--sand2)}
.c.rd{color:var(--red)}
.sel{outline:3px solid var(--sun);outline-offset:2px;transform:translateY(-4px)}
.fl{animation:fl 1.6s}
@keyframes fl{0%,60%{outline:4px solid var(--sun);transform:scale(1.15)}100%{outline:0;transform:none}}

/* TABLE DE JEU */
.status{text-align:center;font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px;color:var(--mut);background:var(--panel);margin:2px 0 8px}
.status.hot{background:var(--sun);color:var(--ink)}
.felt{background-image:var(--felt-pat,none),radial-gradient(110% 90% at 50% 40%,var(--felt-a),var(--felt-b));background-size:var(--felt-size,auto),auto;border:4px solid var(--felt-edge);border-radius:34px;padding:10px 8px 12px;color:var(--sand);
  box-shadow:inset 0 0 50px rgba(0,0,0,.28),0 8px 22px rgba(0,0,0,.28);position:relative}
.seats{display:grid;gap:6px}
.seats.n1{grid-template-columns:1fr}
.seats.n2{grid-template-columns:1fr 1fr}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px;border-radius:18px;border:2px solid transparent;min-width:0}
.seat.turn{border-color:var(--sun);background:rgba(255,200,87,.14)}
.seat.turn .av{border-color:var(--sun)}
.who{display:flex;align-items:center;gap:7px;max-width:100%;min-width:0}
.wn{min-width:0;line-height:1.15;text-align:left}
.wn b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn small{display:block;font-size:11px;opacity:.85;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,max-content);gap:4px;justify-content:center}
.opp .c{width:var(--ow);height:var(--oh);font-size:12px;border-radius:6px;border-width:1.5px;cursor:default}
.opp .c:hover{transform:none}
.seats.n1 .opp .cards{display:flex;flex-wrap:wrap;gap:6px}
.seats.n1 .opp .c{width:calc(var(--ow)*1.3);height:calc(var(--oh)*1.3);font-size:14px}
.opp.pick .c{cursor:pointer;box-shadow:0 0 0 2px var(--sun)}
.opp.pick .c:hover{transform:translateY(-2px)}
.center{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin:10px 0 8px;position:relative}
.dir{position:absolute;right:6px;top:-4px;font-size:12px;opacity:.8}
.pile{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.pile .c{width:var(--pw);height:var(--pph);font-size:24px;cursor:default}
.pile .c:hover{transform:none}
.pile.act{cursor:pointer}
.pile.act .c{cursor:pointer;box-shadow:0 0 0 3px var(--sun),0 0 18px rgba(255,200,87,.6)}
.pile.act .c:hover{transform:translateY(-3px)}
.mine{margin-top:2px}
.mine .cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mine .c{width:var(--mw);height:var(--mh);font-size:20px}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
.bar button{padding:9px 14px;font-size:14px;margin:0;border-radius:12px}
.lg{font-size:12.5px;color:var(--mut);line-height:1.4;padding:4px 6px;margin-top:6px}
.lg div:first-child{color:var(--fg);font-weight:600}

/* feuilles (règles / réglages) */
.ov{position:fixed;inset:0;background:rgba(8,10,28,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:ovin .18s}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sheet);color:var(--fg);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.sheet h2{font-size:28px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sheet h3{font-size:16px;margin:18px 0 8px;color:var(--acc)}
.sheet p,.sheet li{color:var(--fg)}
.sheet ul{margin:6px 0;padding-left:20px}.sheet li{margin:4px 0}
.vals{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin:6px 0}
.vals span{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px}
.vals b{color:var(--acc)}
.x{background:var(--panel);border:1px solid var(--line);color:var(--fg);width:40px;height:40px;padding:0;border-radius:99px;margin:0;font-size:18px}
.prof{display:flex;gap:14px;align-items:center}
.prof>div{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;margin:0;padding:10px 8px}


.ov.mid{align-items:center;padding:20px}
.dlg{background:var(--sheet);color:var(--fg);border:1px solid var(--line);border-radius:26px;padding:24px 20px 16px;max-width:340px;width:100%;text-align:center;animation:pop .2s;box-shadow:0 20px 50px rgba(0,0,0,.45)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.dico{font-size:46px;line-height:1;margin-bottom:8px}
.dlg h2{font-size:26px;margin-bottom:10px}
.dlg p{margin-bottom:8px}
.dlg button{margin:6px 0 0}
.seats.n3{grid-template-columns:repeat(3,1fr)}
.seats.n4{grid-template-columns:1fr 1fr}
@media(min-width:560px){.seats.n4{grid-template-columns:repeat(4,1fr)}}
.seats.n3 .who{flex-direction:column;gap:3px}
.seats.n3 .wn{text-align:center}
.seats.n3 .wn b{max-width:92px}
.seats.n3 .opp .c{width:min(var(--ow),27px);height:min(var(--oh),40px)}

.ib{width:38px;height:38px;padding:0;margin:0;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:18px;line-height:1}
.acc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:18px;padding:10px 12px;margin:8px 0 0}
.acc span:nth-child(2){flex:1;min-width:0}
.acc b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc small{display:block;font-size:12px;color:var(--mut)}
.acc .pt,.rk .pt{font-weight:800;color:var(--acc);white-space:nowrap}
.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:14px}
.rk.me{background:rgba(255,200,87,.18)}
.rk .n{width:28px;text-align:center;font-weight:800;color:var(--mut);font-size:15px}
.rk .rn{flex:1;min-width:0;line-height:1.2}
.rk .rn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .rn small{color:var(--mut);font-size:12px}
.sheet .tbl li{margin:2px 0;font-size:14px}
.dlg .danger{background:var(--flower)}

button:active{box-shadow:0 0 0 4px rgba(255,200,87,.55)}
button.busy{position:relative;color:transparent!important;pointer-events:none;box-shadow:0 0 0 3px rgba(255,200,87,.6)}
button.busy::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid rgba(128,128,128,.35);border-top-color:var(--sp,#fff);animation:spin .7s linear infinite}
button.go.busy{--sp:var(--ink)}button.s.busy{--sp:var(--fg)}button.gbtn.busy{--sp:#1f1f1f}
@keyframes spin{to{transform:rotate(360deg)}}
.coin{flex:none;vertical-align:middle;display:inline-block}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .box{text-align:center;margin:8px 0}
.big2{font-size:26px;font-weight:800;color:var(--acc);display:flex;align-items:center;justify-content:center;gap:6px}
.acc .pt{text-align:right;line-height:1.25;font-size:14px}
.c[data-back=dune]:not(.up){background:radial-gradient(circle,rgba(255,255,255,.28) 0 4px,transparent 5px) 0 0/13px 13px,linear-gradient(145deg,#eaa45a,#b5602a)}
.c[data-back=night]:not(.up){background:radial-gradient(circle,#ffe9a0 0 1.5px,transparent 2px) 0 0/15px 15px,radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 1.5px) 7px 7px/15px 15px,linear-gradient(145deg,#3b3f9a,#171a3a)}
.c[data-back=rose]:not(.up){background:radial-gradient(circle,rgba(255,255,255,.55) 0 3px,transparent 4px) 0 0/14px 14px,linear-gradient(145deg,#ff7aa3,#d6285a)}
.c[data-back=gold]:not(.up){background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 3px,transparent 3px 8px),linear-gradient(145deg,#ffe08a,#c98812);border-color:#fff3c4}
.av[data-frame=gold]{border-color:#ffd978;box-shadow:0 0 0 2px #b57b0c,0 0 10px rgba(255,200,87,.9)}
.av[data-frame=flower]{border-color:#ff5c8a;box-shadow:0 0 0 2px #ffc2d4,0 0 10px rgba(255,92,138,.8)}
.av[data-frame=neon]{border-color:#41e8ff;box-shadow:0 0 0 2px #b04bff,0 0 12px #41e8ff}
.surr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--sun);border-radius:14px;padding:6px 10px;font-size:13px}
.surr button{margin:0}
.rj{text-align:center;margin-top:10px}

/* tapis */
[data-felt=green]{--felt-a:#2c7d49;--felt-b:#1d5c35;--felt-edge:#17462a;--felt-pat:none;--felt-size:auto}
[data-felt=wine]{--felt-a:#8a2b3d;--felt-b:#5a1626;--felt-edge:#401020;--felt-pat:none;--felt-size:auto}
[data-felt=ocean]{--felt-a:#2a6fa8;--felt-b:#173f6b;--felt-edge:#102c4b;--felt-pat:none;--felt-size:auto}
[data-felt=violet]{--felt-a:#6b3fa0;--felt-b:#41236b;--felt-edge:#2c1648;--felt-pat:none;--felt-size:auto}
[data-felt=black]{--felt-a:#3a3a46;--felt-b:#17171d;--felt-edge:#0b0b0f;--felt-pat:none;--felt-size:auto}
[data-felt=stripes]{--felt-a:#2c7d49;--felt-b:#1d5c35;--felt-edge:#17462a;--felt-pat:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 16px,transparent 16px 32px);--felt-size:auto}
[data-felt=dots]{--felt-a:#2a6fa8;--felt-b:#173f6b;--felt-edge:#102c4b;--felt-pat:radial-gradient(rgba(255,255,255,.16) 3px,transparent 4px);--felt-size:22px 22px}
[data-felt=checker]{--felt-a:#8a2b3d;--felt-b:#5a1626;--felt-edge:#401020;--felt-pat:conic-gradient(rgba(255,255,255,.09) 25%,transparent 0 50%,rgba(255,255,255,.09) 0 75%,transparent 0);--felt-size:44px 44px}
[data-felt=diag]{--felt-a:#6b3fa0;--felt-b:#41236b;--felt-edge:#2c1648;--felt-pat:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 3px,transparent 3px 18px);--felt-size:auto}
[data-felt=waves]{--felt-a:#1f8a8a;--felt-b:#0f5a63;--felt-edge:#0a3f47;--felt-pat:repeating-radial-gradient(circle at 50% 130%,transparent 0 12px,rgba(255,255,255,.1) 12px 14px);--felt-size:auto}
[data-felt=stars]{--felt-a:#26307a;--felt-b:#0e1030;--felt-edge:#090b22;--felt-pat:radial-gradient(circle,rgba(255,236,160,.6) 0 1.5px,transparent 2px);--felt-size:28px 28px}
/* polices de pseudo */
.pn[data-font=caveat]{font-family:'Caveat',cursive;font-size:1.2em}
.pn[data-font=lobster]{font-family:'Lobster',cursive}
.pn[data-font=pacifico]{font-family:'Pacifico',cursive}
.pn[data-font=marker]{font-family:'Permanent Marker',cursive}
.pn[data-font=bangers]{font-family:'Bangers',cursive;letter-spacing:.04em}
.pn[data-font=orbitron]{font-family:'Orbitron',sans-serif;font-weight:700}
.pn[data-font=pixel]{font-family:'Press Start 2P',monospace;font-size:.68em;line-height:1.6}
.pn[data-font=creepster]{font-family:'Creepster',cursive;letter-spacing:.04em}
/* émotes */
.who{position:relative}
.emo{position:absolute;left:26px;top:-18px;font-size:26px;line-height:1;background:rgba(0,0,0,.42);border-radius:16px;padding:1px 6px;z-index:3;animation:emo 3s ease both;pointer-events:none}
@keyframes emo{0%{transform:scale(.3);opacity:0}10%{transform:scale(1.25);opacity:1}18%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.seats.n3 .emo{left:50%;margin-left:10px}
.emorow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}

function say(s,t,slots,r,mv,by){s.ev={n:(s.ev?s.ev.n:0)+1,t,slots:slots||[],rev:r||null,mv:mv||null,by:by==null?-1:by};s.log.unshift(t);s.log=s.log.slice(0,5)}
const actives=s=>s.players.map((p,i)=>i).filter(i=>!s.players[i].out);
function endGame(s){
  const a=actives(s),pe=s.ev||{};
  s.phase='end';s.loser=a.length?a[0]:null;s.stage='';s.held=null;s.surr=null;
  s.rank=(s.order||[]).filter(i=>!s.players[i].left).concat(a.filter(i=>!s.players[i].left));
  say(s,a.length?'Fin de partie : '+s.players[a[0]].name+' est le dernier en jeu 🌵':'Fin de partie',pe.slots,pe.rev,pe.mv,pe.by);
}
function nextTurn(s){
  const a=actives(s);
  if(a.length<=1){endGame(s);return}
  let i=s.turn;do{i=(i+1)%s.players.length}while(s.players[i].out);
  s.turn=i;s.stage='draw';s.held=null;
}
const pen=(s,i)=>{const p=s.players[i];p.cards.push(takeDeck(s));return [{a:['deck'],b:['slot',i,p.cards.length-1],f0:'d',f1:'d'}]};

  if(s.deck.length<1){const top=s.disc.pop();s.deck=sh(s.disc);s.disc=[top]}
  if(s.deck.length<1){let d=[];for(const r of R)for(const u of SU)d.push({r,s:u});s.deck=sh(d)}

}

const RD={};let isHost=false,peer=null,hconn=null,conns={},code='';

function send(op,a){a=a||[];if(isHost)handle(uid,op,a,null,myName,myAv,curCos());else if(hconn&&hconn.open)hconn.send(JSON.stringify({id:uid,name:myName,av:myAv,cos:curCos(),op,a}))}

function watchOff(){
  if(offTimer)return;
  offTimer=setInterval(()=>{
    if(!S||!isHost||(S.phase!=='look'&&S.phase!=='play'))return;
    let ch=false;const now=Date.now();
    for(let i=0;i<S.players.length;i++){
      const p=S.players[i];if(!p.off||p.left)continue;
      const sec=Math.max(0,60-Math.floor((now-(p.offAt||now))/1000));
      if(sec<=0){doLeave(S,i);broadcast();return}
      if(p.offSec!==sec){p.offSec=sec;ch=true}
    }
    if(ch)broadcast();
  },1000);
}
function toConn(c,o){try{c.send(JSON.stringify(o))}catch(e){}}
function broadcast(){const m=JSON.stringify({t:'s',s:S});for(const k in conns)try{conns[k].send(m)}catch(e){}onState();render()}
function handle(pid,op,a,c,name,av,cos){
  if(op==='join'){
    if(!S.players.some(p=>p.id===pid)){
      if(S.phase!=='lobby'){if(c)toConn(c,{err:'La partie a déjà commencé'});return}
      if(S.players.length>=MAXP){if(c)toConn(c,{err:'Salle pleine ('+MAXP+' joueurs maximum)'});return}
      S.players.push({id:pid,name:String(name||'Joueur').slice(0,14),av:okAv(av),cos:okCos(cos),cards:[]});
    }else{
      const q=S.players.find(p=>p.id===pid);
      if(q&&q.left){if(c)toConn(c,{err:'Tu as quitté cette partie'});return}
      if(q){q.off=false;delete q.offAt;delete q.offSec}
    }
  }else{
    const i=S.players.findIndex(p=>p.id===pid);
    if(i<0||!RD[op])return;
    if(RD[op](S,i,...a)===false)return;
  }
  broadcast();
}

function openRoom(n){

    if(e.type==='unavailable-id'&&n<5){try{peer.destroy()}catch(x){}openRoom(n+1)}

}

function connect(){
  msg='Connexion…';if(!S){emoInit=false;emoShow={};render()}
  if(peer)try{peer.destroy()}catch(e){}
  const pr=new Peer();peer=pr;
  const lost=()=>{
    if(S&&S.phase==='end')return;
    if(!lostAt)lostAt=Date.now();
    if(Date.now()-lostAt>65000)return giveUp();
    setTimeout(()=>{if(peer===pr)connect()},2000);
  };
  pr.on('open',()=>{
    if(peer!==pr)return;
    const hc=pr.connect('cactus-'+code,{reliable:true});hconn=hc;
    hc.on('open',()=>{if(hconn!==hc)return;msg='';send('join')});

      if(hconn!==hc)return;
      const m=JSON.parse(d);
      if(m.closed){hconn=null;try{pr.destroy()}catch(e){}peer=null;S=null;mi=-1;msg='La partie a été fermée par l’hôte';clearSess();render();return}
      if(m.err){msg=m.err;S=null;clearSess();render();return}
      lostAt=0;S=m.s;onState();saveSess();render();
    });
    hc.on('close',()=>{if(hconn!==hc)return;if(S)lost();else{msg='Connexion perdue';render()}});
  });

    if(peer!==pr)return;
    if(!S){msg=e.type==='peer-unavailable'?'Code introuvable : la partie n’existe plus ou l’hôte est parti':'Erreur réseau : '+e.type;if(e.type==='peer-unavailable')clearSess();render()}

const DUR=650;
const key=l=>l[0]==='slot'?'s:'+l[1]+':'+l[2]:l[0];
function elOf(l){
  if(l[0]==='slot')return app.querySelector('.c[data-p="'+l[1]+'"][data-i="'+l[2]+'"]');
  if(l[0]==='deck')return app.querySelector('[data-pile="deck"] .c');
  if(l[0]==='disc')return app.querySelector('[data-pile="disc"] .c');
  if(l[0]==='held')return app.querySelector('.pile.held .c');
  return null;
}
function snapDom(){
  const o={};
  app.querySelectorAll('.c[data-p]').forEach(e=>{o['s:'+e.dataset.p+':'+e.dataset.i]=e.getBoundingClientRect()});
  ['deck','disc','held'].forEach(k=>{const e=elOf([k]);if(e)o[k]=e.getBoundingClientRect()});
  return o;
}
function paintDisc(){
  const e=elOf(['disc']);if(!e||!S)return;
  const t=S.disc[S.disc.length-1];
  e.className='c up'+(t&&red(t)?' rd':'');e.textContent=t?nm(t):'–';
}
function hideDest(x){
  const e=elOf(x.b);if(!e)return;
  if(x.under){e.className='c up'+(red(x.under)?' rd':'');e.textContent=nm(x.under)}else e.style.visibility='hidden';
}
function showDest(x){
  fl=fl.filter(y=>y!==x);
  if(fl.some(y=>key(y.b)===key(x.b)))return;
  const e=elOf(x.b);if(!e)return;
  if(x.under)paintDisc();else e.style.visibility='';
}
function fly(m,src,dst,by,x){
  const up=f=>f==='u'||(f==='m'&&by===mi);
  const box=document.createElement('div');box.className='fly';
  box.style.cssText='left:'+dst.left+'px;top:'+dst.top+'px;width:'+dst.width+'px;height:'+dst.height+'px';
  const c=document.createElement('div');c.style.fontSize=Math.round(dst.height*.3)+'px';
  const bk=((m.b[0]==='slot'?(S.players[m.b[1]]||{}).cos:m.a[0]==='slot'?(S.players[m.a[1]]||{}).cos:curCos())||{});
  const paint=u=>{c.className='c'+(u?' up':'')+(u&&m.c&&red(m.c)?' rd':'');c.dataset.back=bk.back||'';c.textContent=u&&m.c?nm(m.c):''};
  paint(up(m.f0));box.appendChild(c);document.body.appendChild(box);
  const d=m.d||0,dx=src.left+src.width/2-(dst.left+dst.width/2),dy=src.top+src.height/2-(dst.top+dst.height/2);
  const a=box.animate([
    {transform:'translate('+dx+'px,'+dy+'px) scale('+(src.width/dst.width)+','+(src.height/dst.height)+')'},
    {transform:'translate('+(dx/2)+'px,'+(dy/2)+'px) scale(1.14)',offset:.5},
    {transform:'translate(0,0) scale(1,1)'}
  ],{duration:DUR,delay:d,easing:'cubic-bezier(.3,.7,.3,1)',fill:'both'});
  if(up(m.f0)!==up(m.f1)){
    c.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:DUR,delay:d,fill:'both'});
    setTimeout(()=>paint(up(m.f1)),d+DUR/2);
  }
  const done=()=>{if(box.isConnected)box.remove();showDest(x)};
  a.onfinish=done;setTimeout(done,d+DUR+500);
}
function playMoves(mv,snap,by){
  try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  mv.forEach(m=>{
    const de=elOf(m.b);if(!de)return;
    const dst=de.getBoundingClientRect();
    let src=snap[key(m.a)];
    if(!src){const se=elOf(m.a);if(se)src=se.getBoundingClientRect()}
    if(!src||!dst.width)return;
    const x={b:m.b,under:m.under||null};
    fl.push(x);hideDest(x);
    try{fly(m,src,dst,by,x)}catch(e){showDest(x)}
  });
}

  const up=p.out||S.phase==='end'||peeks[pi+'-'+ci]||(rev&&rev.pi===pi&&(rev.cis==='all'||rev.cis.includes(ci)));
  const f=fresh&&S.ev&&S.ev.slots.some(x=>x[0]===pi&&x[1]===ci);
  return `<div class="c${up?' up':''}${up&&red(c)?' rd':''}${f?' fl':''}${pi===mi&&sel===ci&&S.stage==='valet'?' sel':''}" data-back="${esc((p.cos&&p.cos.back)||'')}" data-p="${pi}" data-i="${ci}">${up?nm(c):''}</div>`;
}

    app.innerHTML=head()+`<div class="box codeb"><div class="mut">Code de la partie</div><div class="code">${S.code}</div>
    <button class="go" onclick="shareLink()">Inviter des joueurs</button></div>
    ${S.note?`<div class="box mut">${esc(S.note)}</div>`:''}
    <div class="box"><b>Joueurs (${S.players.length}/${MAXP})</b><div class="pl">${S.players.map(p=>`<span class="chip">${avHtml(p.name,p.av,'av',p.cos&&p.cos.frame)}${nameHtml(p.name,p.cos&&p.cos.font)}${p.id===S.host?' 👑':''}${p.id===uid?' (toi)':''}</span>`).join('')}</div></div>
    <div class="box"><button class="s w" style="margin:0" onclick="openSheet('equip')">🎨 Personnaliser : tapis, dos de cartes, police…</button></div>
    ${host?`<div class="box"><b>Cartes par joueur</b><div style="margin-top:6px">${[4,5,6].map(n=>`<button class="${S.n===n?'on':'s'}" onclick="setN(${n})">${n}</button>`).join('')}</div>
    <button class="go w" style="margin-top:10px" onclick="start()" ${S.players.length<2?'disabled':''}>${S.players.length<2?'Il faut au moins 2 joueurs':'Lancer la partie'}</button>
    <p class="mut" style="margin-top:8px">Garde cette page ouverte : la partie tourne sur ton appareil.</p></div>`:`<div class="box"><p class="mut">En attente du lancement par l’hôte… (${S.n} cartes par joueur)</p></div>`}`;return;
  }
  const me=S.players[mi],myTurn=S.phase==='play'&&S.turn===mi&&!me.out,st=S.stage;
  const top=S.disc[S.disc.length-1],canDraw=myTurn&&st==='draw',ended=S.phase==='end',pick=myTurn&&st==='valet';
  let status='',hot=false;
  if(S.phase==='look'){status=me.ready?'En attente des autres joueurs…':`Touche 2 de tes cartes pour les mémoriser (${looks}/2)`;hot=!me.ready}
  else if(S.phase==='play'){
    if(myTurn){hot=true;status=st==='draw'?'À toi ! Touche la pioche ou la défausse':st==='hold'?'Touche une de tes cartes pour l’échanger':st==='seven'?'7 : touche une de tes cartes pour la regarder':'Valet obligatoire : une de tes cartes, puis une carte adverse'}
    else if(me.left)status='Tu as quitté la partie';
    else if(!me.out)status='Tour de '+S.players[S.turn].name+'…';
    else status='Tu as réussi ton Cactus 🏆';
  }else if(ended){
    hot=true;
    if(S.flat!=null){status=S.rank&&S.rank.includes(mi)?'Un joueur a quitté · +'+fmt(S.flat)+' 🌵 · +'+coinsFor(S.flat)+' §':'Tu as quitté la partie : aucun gain'}
    else{const rk=S.rank?S.rank.indexOf(mi):-1,rn=S.rank?S.rank.length:0;
      status=(rk>=0&&rn>=2)?(rk===0?'🏆 Victoire ! ':'Tu finis '+ord(rk)+' · ')+'+'+fmt(gainFor(rk,rn))+' 🌵 · +'+coinsFor(gainFor(rk,rn))+' §':(S.loser!=null?'🌵 Perdant : '+S.players[S.loser].name:'Fin de partie')}
  }
  const pts=p=>p.cards.reduce((t,c)=>t+val(c),0);
  const seat=(i,cls)=>{
    const p=S.players[i],t=S.phase==='play'&&S.turn===i&&!p.out;
    const rk=ended&&S.rank?S.rank.indexOf(i):-1,rn=S.rank?S.rank.length:0;
    const sub=p.left?'a quitté':ended?(S.flat!=null?(rk>=0?'+'+fmt(S.flat)+' 🌵 · ':''):(rk>=0&&rn>=2?(['🥇','🥈','🥉','4e','5e'][rk]+' +'+fmt(gainFor(rk,rn))+' 🌵 · '):''))+pts(p)+' pts':p.off?'hors ligne · '+(p.offSec!=null?p.offSec+' s':'…'):p.out?'Cactus réussi 🏆':t?(i===mi?'à toi de jouer':'joue…'):p.cards.length+' cartes';
    return `<div class="seat ${cls}${t?' turn':''}${pick&&i!==mi&&!p.out?' pick':''}"><div class="who">${avHtml(p.name,p.av,'av',p.cos&&p.cos.frame)}${emoBubble(p)}<div class="wn"><b>${nameHtml(p.name,p.cos&&p.cos.font)}${i===mi?' (toi)':''}${S.phase==='look'&&p.ready?' ✓':''}</b><small>${esc(sub)}</small></div></div><div class="cards">${p.cards.map((_,c)=>cd(i,c)).join('')}</div></div>`;
  };
  const others=[];for(let k=1;k<S.players.length;k++)others.push((mi+k)%S.players.length);
  const held=S.held&&st==='hold'?(S.turn===mi||S.heldPub?`<div class="pile held"><div class="c up big${red(S.held)?' rd':''}">${nm(S.held)}</div><span>en main</span></div>`:`<div class="pile held"><div class="c" data-back="${curCos().back||''}"></div><span>en main</span></div>`):'';
  let h=head()+`<div class="status${hot?' hot':''}" role="status">${esc(status).replace(/§/g,coinSvg(16))}</div>`;
  h+=`<div class="felt"><div class="seats n${others.length}">${others.map(i=>seat(i,'opp')).join('')}</div>
  <div class="center"><span class="dir" title="Sens du jeu">↻</span>
    <div class="pile${canDraw?' act':''}" data-pile="deck"><div class="c" data-back="${curCos().back||''}"></div><span>pioche · ${S.deck.length}</span></div>
    <div class="pile${canDraw&&top?' act':''}" data-pile="${top?'disc':''}"><div class="c up${top&&red(top)?' rd':''}${fresh?' fl':''}">${top?nm(top):'–'}</div><span>défausse</span></div>${held}</div>
  ${seat(mi,'mine')}</div>`;
  let bar='';
  if(S.phase==='look'&&!me.ready)bar+=`<button class="go" onclick="ready()" ${looks<2?'disabled':''}>Je suis prêt</button>`;
  if(myTurn&&st==='seven')bar+=`<button class="s" onclick="pass()">Passer</button>`;
  if(S.phase==='play'&&!me.out&&st!=='valet'&&(canDraw||!myTurn))bar+=`<button class="s" onclick="askCactus()">🌵 Cactus</button>`;
  if(S.phase==='play'&&!me.out)bar+=`<button class="${flashMode?'on':'s'}" onclick="flashMode=!flashMode;render()">⚡ ${flashMode?'Touche la carte à poser':'Poser une carte'}</button>`;
  if((S.phase==='play'||S.phase==='look')&&!me.left){
    if(!S.surr)bar+=`<button class="s" onclick="surrPropose()">🤝 Abandonner ensemble</button>`;
    else{
      const by=S.players[S.surr.by],mineP=S.surr.by===mi,said=S.surr.yes.includes(mi),nv=S.players.filter(q=>!q.left&&!q.off).length;
      bar+=`<div class="surr">🤝 <b>${esc(by.name)}</b> propose d’abandonner ensemble <span class="mut">${S.surr.yes.length}/${nv}</span>${mineP?`<button class="s sm" onclick="surrPropose()">Annuler</button>`:said?'<span class="mut">En attente…</span>':`<button class="go sm" onclick="surrAns(true)">Accepter</button><button class="s sm" onclick="surrAns(false)">Refuser</button>`}</div>`;
    }
  }
  if(!me.left)bar+=`<button class="${emoOpen?'on':'s'}" onclick="emoOpen=!emoOpen;render()" aria-label="Émotes">😀</button>`;
  if(me.left)bar+=`<button class="go" onclick="leaveGame()">Retour à l’accueil</button>`;
  if(ended&&CC_ON&&!(window.CC&&window.CC.user)&&S.rank&&S.rank.includes(mi)&&(S.flat!=null||S.rank.length>=2))bar+=`<button class="s" onclick="openSheet('acc')">🔐 Connecte-toi pour garder tes 🌵</button>`;
  if(ended)bar+=host?'<button class="go" onclick="again()">Rejouer</button>':S.players.some(q=>q.id===S.host&&q.left)?'<span class="mut">L’hôte a quitté : retourne à l’accueil.</span>':'<span class="mut">L’hôte peut relancer une partie.</span>';
  if(bar)h+=`<div class="bar">${bar}</div>`;
  if(emoOpen){const oe=SHOP.filter(i=>i.cat==='emote'&&isOwned(i));h+=`<div class="emorow">${oe.map(e=>`<button class="emb" onclick="sendEmote('${e.id}')" aria-label="${esc(e.name)}">${e.ico}</button>`).join('')}</div>`}
  h+=`<div class="lg">${S.log.slice(0,3).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
  const snap=(S.ev&&S.ev.mv&&S.ev.n!==animN)?snapDom():null;
  app.innerHTML=h;
  fl.forEach(hideDest);
  if(S.ev&&S.ev.n!==animN){animN=S.ev.n;if(snap)playMoves(S.ev.mv,snap,S.ev.by)}
  if(S.ev)seenN=S.ev.n;
}
app.addEventListener('click',e=>{
  const pile=e.target.closest('[data-pile]');
  if(pile&&S&&pile.dataset.pile&&S.phase==='play'&&S.turn===mi&&S.stage==='draw'&&!S.players[mi].out){drawFrom(pile.dataset.pile);return}
  const el=e.target.closest('.c[data-p]');if(!el||!S)return;
  const pi=+el.dataset.p,ci=+el.dataset.i,me=S.players[mi],mine=pi===mi;
  if(S.phase==='look'){if(mine&&!me.ready&&looks<2&&!peeks[pi+'-'+ci]){looks++;peek(ci)}return}
  if(S.phase!=='play'||me.out)return;
  if(flashMode&&mine){flashMode=false;flash(ci);return}
  if(S.turn!==mi)return;
  if(S.stage==='hold'&&mine)swap(ci);
  else if(S.stage==='seven'&&mine){peek(ci);seven(ci)}
  else if(S.stage==='valet'){if(mine){sel=ci;render()}else if(sel!==null&&!S.players[pi].out){const s0=sel;sel=null;valet(s0,pi,ci)}}
});
render();
</script>
<script type="module">
const cfg=window.FIREBASE_CONFIG;
if(cfg){
  try{
    const B='https://www.gstatic.com/firebasejs/10.14.1/';
    const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(cfg),auth=Au.getAuth(app),db=Fs.getFirestore(app);
    auth.languageCode='fr';
    const ref=()=>Fs.doc(db,'players',auth.currentUser.uid);
    const mk=u=>({uid:u.uid,email:u.email,displayName:u.displayName,photoURL:u.photoURL,emailVerified:u.emailVerified});
    const CC=window.CC={ready:true,user:null,me:null,
      google:async()=>{const pr=new Au.GoogleAuthProvider();
        try{await Au.signInWithPopup(auth,pr)}
        catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await Au.signInWithRedirect(auth,pr);else throw e}},
      login:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
      signup:async(e,p,n)=>{
        const c=await Au.createUserWithEmailAndPassword(auth,e,p);
        try{await Au.updateProfile(c.user,{displayName:n||''})}catch(x){}
        try{await Au.sendEmailVerification(c.user)}catch(x){console.error(x)}
      },
      resend:async()=>{await Au.sendEmailVerification(auth.currentUser)},
      reload:async()=>{const u=auth.currentUser;if(!u)return;await u.reload();await u.getIdToken(true);CC.user=mk(u);window.onAuth&&window.onAuth()},
      logout:()=>Au.signOut(auth),
      ensure:async(name,photo)=>{
        const r=ref(),sn=await Fs.getDoc(r);
        if(sn.exists()){const d=sn.data();
          if(d.coins==null){const up={coins:50,owned:{},eq:{}};await Fs.updateDoc(r,up);return {...d,...up}}
          return {owned:{},eq:{},...d}}
        const d={name:String(name||'Joueur').slice(0,14),photo:photo||'',pts:0,games:0,wins:0,coins:50,owned:{},eq:{},t:Fs.serverTimestamp()};
        await Fs.setDoc(r,d);return {...d,_new:true}
      },
      saveProfile:async(name,photo)=>{if(!auth.currentUser||!CC.me)return;await Fs.updateDoc(ref(),{name:String(name||'Joueur').slice(0,14),photo:photo||''})},
      addPoints:async(g,win,k)=>{
        await Fs.updateDoc(ref(),{pts:Fs.increment(g),games:Fs.increment(1),wins:Fs.increment(win?1:0),coins:Fs.increment(k||0),t:Fs.serverTimestamp()});
        if(CC.me){CC.me.pts=(CC.me.pts||0)+g;CC.me.games=(CC.me.games||0)+1;if(win)CC.me.wins=(CC.me.wins||0)+1;CC.me.coins=(CC.me.coins||0)+(k||0)}
      },
      buy:async(key,price)=>{
        await Fs.updateDoc(ref(),{coins:Fs.increment(-price),['owned.'+key]:true});
        if(CC.me){CC.me.coins=(CC.me.coins||0)-price;CC.me.owned=Object.assign({},CC.me.owned,{[key]:true})}
      },
      equip:async(eq)=>{await Fs.updateDoc(ref(),{eq});if(CC.me)CC.me.eq=eq},
      top:async()=>{const q=Fs.query(Fs.collection(db,'players'),Fs.orderBy('pts','desc'),Fs.limit(50));const sn=await Fs.getDocs(q);return sn.docs.map(d=>({id:d.id,...d.data()}))}
    };
    Au.onAuthStateChanged(auth,u=>{CC.user=u?mk(u):null;if(!u)CC.me=null;window.onAuth&&window.onAuth()});
  }catch(e){console.error('Firebase',e);window.CC=null;window.onAuth&&window.onAuth()}
}
</script></body></html>
